{% extends "base.html" %}

{% block content %}
<div class="space-y-6" x-data="{ currentSymbol: '{{ target_symbol }}', currentTf: '{{ current_tf }}', wyckoffOverlay: true }">

  <!-- TOP CONTROL BAR: SEARCH & TIMEFRAME SELECTOR -->
  <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div class="flex flex-wrap items-center gap-3">
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-zinc-500 font-mono text-xs">SYM:</span>
        <input 
          id="tech-symbol-input" 
          name="symbol"
          type="text" 
          value="{{ target_symbol }}" 
          x-model="currentSymbol"
          @keydown.enter="$dispatch('submit-ta')"
          class="bg-zinc-900 border border-zinc-700/80 rounded-lg pl-12 pr-3 py-1.5 text-xs text-white uppercase font-mono tracking-wider focus:outline-none focus:border-emerald-500 w-36"
          placeholder="TICKER"
        />
      </div>
      
      <!-- Quick Symbol Pill Selectors -->
      <div class="flex flex-wrap items-center gap-1.5 text-[11px] font-mono">
        <span class="text-zinc-500 text-xs mr-1">Quick:</span>
        {% for qs in quick_symbols %}
        <button 
          type="button"
          @click="currentSymbol = '{{ qs }}'; $dispatch('submit-ta')"
          hx-get="/api/technical/analyze?symbol={{ qs }}&tf={{ current_tf }}"
          hx-target="#analysis-container"
          hx-swap="innerHTML"
          hx-indicator="#tech-spinner"
          class="px-2 py-1 rounded transition {% if qs == target_symbol %}bg-emerald-950 text-emerald-400 border border-emerald-800 font-semibold{% else %}bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800{% endif %}"
        >
          {{ qs }}
        </button>
        {% endfor %}
      </div>
    </div>

    <div class="flex items-center gap-3">
      <!-- Timeframe Pills -->
      <div class="flex items-center bg-zinc-900 border border-zinc-800 rounded-lg p-0.5 text-xs font-mono">
        <input type="hidden" name="tf" :value="currentTf">
        <button 
          type="button"
          @click="currentTf = '1d'"
          hx-get="/api/technical/analyze"
          hx-include="[name='symbol']"
          hx-vals='{"tf": "1d"}'
          hx-target="#analysis-container"
          hx-swap="innerHTML"
          hx-indicator="#tech-spinner"
          :class="currentTf === '1d' ? 'px-2.5 py-1 rounded bg-zinc-800 text-white font-semibold' : 'px-2.5 py-1 rounded text-zinc-400 hover:text-white transition'"
        >
          1D (Daily)
        </button>
        <button 
          type="button"
          @click="currentTf = '1wk'"
          hx-get="/api/technical/analyze"
          hx-include="[name='symbol']"
          hx-vals='{"tf": "1wk"}'
          hx-target="#analysis-container"
          hx-swap="innerHTML"
          hx-indicator="#tech-spinner"
          :class="currentTf === '1wk' ? 'px-2.5 py-1 rounded bg-zinc-800 text-white font-semibold' : 'px-2.5 py-1 rounded text-zinc-400 hover:text-white transition'"
        >
          1W (Weekly)
        </button>
        <button 
          type="button"
          @click="currentTf = '1mo'"
          hx-get="/api/technical/analyze"
          hx-include="[name='symbol']"
          hx-vals='{"tf": "1mo"}'
          hx-target="#analysis-container"
          hx-swap="innerHTML"
          hx-indicator="#tech-spinner"
          :class="currentTf === '1mo' ? 'px-2.5 py-1 rounded bg-zinc-800 text-white font-semibold' : 'px-2.5 py-1 rounded text-zinc-400 hover:text-white transition'"
        >
          1M (Monthly)
        </button>
      </div>

      <button 
        type="button"
        @submit-ta.window="$el.click()"
        hx-get="/api/technical/analyze"
        hx-include="[name='symbol'], [name='tf']"
        hx-target="#analysis-container"
        hx-swap="innerHTML"
        hx-indicator="#tech-spinner"
        class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg transition shadow-sm flex items-center gap-2"
      >
        <span id="tech-spinner" class="htmx-indicator spinner w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        <span>⚡ Compute TA & Chart</span>
      </button>
    </div>
  </div>

  <!-- DYNAMIC ANALYSIS CONTAINER -->
  <div id="analysis-container" class="space-y-6">
    {% if error_msg %}
      <div class="bg-rose-950/40 border border-rose-800 rounded-xl p-6 text-center text-xs font-mono text-rose-300">
        <p class="font-bold text-sm mb-1">❌ Technical Analysis Error</p>
        <p>{{ error_msg }}</p>
      </div>
    {% elif data %}
      {% include "technical/partials/analysis.html" %}
    {% endif %}
  </div>

</div>
{% endblock %}
