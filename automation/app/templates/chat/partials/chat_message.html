<!-- User Message Bubble -->
<div class="flex justify-end gap-2 font-sans text-xs">
  <div class="bg-emerald-600 text-white rounded-xl px-4 py-2.5 max-w-lg shadow-sm">
    {{ user_message }}
  </div>
</div>

<!-- AI Response Bubble -->
<div class="flex gap-2 font-sans text-xs">
  <span class="w-6 h-6 rounded-full bg-zinc-800 text-zinc-300 flex items-center justify-center font-bold text-[10px] shrink-0 font-mono">
    AI
  </span>
  <div class="bg-zinc-900 border border-zinc-800 text-zinc-200 rounded-xl px-4 py-2.5 max-w-xl shadow-sm whitespace-pre-wrap leading-relaxed">
    {{ ai_reply }}
  </div>
</div>
