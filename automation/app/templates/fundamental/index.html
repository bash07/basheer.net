{% extends "base.html" %}

{% block content %}
<div class="space-y-6">

  <!-- TOP HEADER & CONTROLS -->
  <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-5 space-y-4">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h2 class="text-base font-bold text-white tracking-tight">Fundamental Valuation Screener</h2>
        <p class="text-xs text-zinc-400">Deep value Graham Number, Peter Lynch GARP PEG, and Buffett Quality screens</p>
      </div>

      <form 
        hx-post="/api/fundamental/screen"
        hx-target="#fundamental-results"
        hx-swap="outerHTML"
        hx-indicator="#fundamental-spinner"
        class="flex items-center gap-2"
      >
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <select name="method" class="bg-zinc-900 text-zinc-200 border border-zinc-800 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-emerald-500 font-mono">
          <option value="graham">Benjamin Graham (Deep Value)</option>
          <option value="lynch">Peter Lynch (GARP PEG)</option>
          <option value="buffett">Buffett Quality Matrix</option>
        </select>
        
        <button 
          type="submit"
          class="py-1.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold transition flex items-center gap-2 shadow-sm font-mono"
        >
          <div id="fundamental-spinner" class="spinner htmx-indicator"></div>
          <span>Run Valuation Screen</span>
        </button>
      </form>
    </div>
  </div>

  <!-- SCREEN RESULTS TABLE -->
  {% include "fundamental/partials/screen_table.html" %}

</div>
{% endblock %}
