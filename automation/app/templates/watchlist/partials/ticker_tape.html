{% if quotes %}
  {% for sym, q in quotes.items() %}
    {% if q %}
    <span class="flex items-center gap-1.5">
      <strong class="text-white">{{ sym.replace("-USD", "").replace("^", "") }}:</strong>
      ${{ "%.2f"|format(q.price) if q.price >= 1 else "%.4f"|format(q.price) }}
      <span class="{% if q.change_pct >= 0 %}text-emerald-400{% else %}text-rose-400{% endif %} font-semibold">
        {{ "%+.1f"|format(q.change_pct) }}%
      </span>
    </span>
    {% endif %}
  {% endfor %}
{% else %}
  <span class="text-zinc-500">Quotes sync active</span>
{% endif %}
