{% extends "base.html" %}

{% block content %}
<div class="space-y-6">

  <!-- MONITOR CONTROLS & CARDS -->
  <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-5 space-y-4">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <h2 class="text-base font-bold text-white tracking-tight">Endpoint Health & SSL Certificate Monitor</h2>
        <p class="text-xs text-zinc-400">Continuous HTTP/TLS uptime probes recording latency and SSL certificate expiry days</p>
      </div>

      <button 
        hx-post="/api/monitor/check"
        hx-target="#probe-cards-container"
        hx-swap="outerHTML"
        hx-indicator="#probe-spinner"
        class="py-1.5 px-3 bg-zinc-900 hover:bg-zinc-800 text-zinc-200 border border-zinc-800 rounded-lg text-xs font-mono transition flex items-center gap-2 self-start sm:self-auto"
      >
        <div id="probe-spinner" class="spinner htmx-indicator"></div>
        <span>🔄 Probe Endpoints Now</span>
      </button>
    </div>

    <!-- PROBE CARDS CONTAINER -->
    {% include "monitor/partials/probe_cards.html" %}
  </div>

</div>
{% endblock %}
