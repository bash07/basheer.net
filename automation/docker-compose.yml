services:
  automation-server:
    build: ./app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Kolkata
    env_file: .env
    volumes:
      - automation_data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  automation_data:
  caddy_data:
  caddy_config:
