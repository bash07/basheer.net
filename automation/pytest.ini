[pytest]
# Add app/ to sys.path so `from modules.finance...` and `from core...` work
pythonpath = app
testpaths  = tests
asyncio_mode = auto

# Display: show test names + short tracebacks
addopts = -v --tb=short

# Treat all warnings as errors (keeps code clean)
filterwarnings =
    error
    # Third-party packages on Python 3.13 — we can't fix these upstream
    ignore::DeprecationWarning:yfinance
    ignore::DeprecationWarning:pandas
    ignore::DeprecationWarning:pkg_resources
    ignore::FutureWarning:pandas
    ignore::UserWarning:mplfinance
    ignore::UserWarning:apscheduler
    # google-genai / pydantic-ai internals
    ignore::DeprecationWarning:google
    ignore::DeprecationWarning:pydantic
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
