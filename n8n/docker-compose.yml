services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # --- Core Settings ---
      - N8N_HOST=n8n.basheer.net
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.basheer.net/
      - GENERIC_TIMEZONE=Asia/Kolkata

      # --- Authentication (N8N v2+) ---
      # Basic auth was removed in N8N v1.x — using built-in user management instead.
      # On FIRST visit to https://n8n.basheer.net, you will be prompted to create
      # an owner account (email + password). That becomes your login.
      - N8N_PERSONALIZATION_ENABLED=false

      # --- Performance (for e2-micro) ---
      - N8N_METRICS=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168 # 7 days

    volumes:
      - n8n_data:/home/node/.n8n

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
